# Flujo de GitHub Actions: compila la APK cada vez que subís cambios.
name: Compilar APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:   # Permite compilar a mano con un botón

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga tu código del repositorio
      - name: Descargar código
        uses: actions/checkout@v4

      # 2. Instala Java 17 (necesario para compilar Android)
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. Instala Gradle (no usamos wrapper porque no tenés PC para generarlo)
      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # 4. Compila la APK de depuración (se instala sin firmar con tienda)
      - name: Compilar APK
        run: gradle assembleDebug --stacktrace

      # 5. Guarda la APK para que puedas descargarla
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: FSConverter-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          
